[tools]
go = "1.26.4"
lua = "5.5.0"
node = "26.3.0"
"npm:@earendil-works/pi-coding-agent" = "1.6.0"
python = "3.14.6"
ruby = "4.0.5"
rust = "1.99.1"
zig = "0.15.2"

# Homebrew owns these on macOS; Linux distributions ship them too old or not at
# all, so mise installs them there from release binaries.
bun = { version = "1.3.14", os = ["linux"] }
"aqua:1password/cli" = { version = "2.38.1", os = ["linux"] }
"aqua:JohnnyMorganz/StyLua" = { version = "2.5.2", os = ["linux"] }
"aqua:astral-sh/uv" = { version = "0.12.3", os = ["linux"] }
"aqua:cli/cli" = { version = "2.97.0", os = ["linux"] }
"aqua:jesseduffield/lazygit" = { version = "0.64.1", os = ["linux"] }
"aqua:junegunn/fzf" = { version = "0.74.2", os = ["linux"] }
"aqua:mvdan/sh" = { version = "3.13.1", os = ["linux"] }
"aqua:neovim/neovim" = { version = "0.12.6", os = ["linux"] }
"aqua:sharkdp/fd" = { version = "10.4.2", os = ["linux"] }
"github:griffinqiu/bootmux" = { version = "0.3.4", os = ["linux"] }
"github:herdrdev/herdr" = { version = "0.9.5", os = ["linux"] }
"github:so-fancy/diff-so-fancy" = { version = "1.4.14", os = ["linux"] }
"gitlab:gitlab-org/cli" = { version = "1.128.0", os = ["linux"] }

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
trusted_config_paths = ["~/.herdr/worktrees"]
