id = "dotfiles.remote-open"
name = "Remote Open"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Ctrl-click an http(s) link to open it in the configured browser."
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open link"
command = ["bash", "open.sh"]

[[link_handlers]]
id = "any-http"
title = "Open link"
pattern = "^https?://"
action = "open"
