onboarding = false

[terminal]
# Match tmux's pane_current_path behavior for new panes and tabs.
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# General
help = "prefix+?"
# settings = "prefix+ctrl+t"
detach = "prefix+shift+q"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+shift+o"

# Workspace/session navigation. prefix+w is reused below for the bootmux project
# picker instead of Herdr's persistent workspace navigation mode.
goto = "prefix+g"
new_worktree = "prefix+t"
open_worktree = "prefix+ctrl+t"
remove_worktree = "prefix+shift+t"
workspace_picker = ""
new_workspace = ""
rename_workspace = ""
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
switch_workspace = "prefix+shift+1..9"
previous_agent = "prefix+ctrl+p"
next_agent = "prefix+ctrl+n"
focus_agent = "prefix+ctrl+1..9"
remote_image_paste = "alt+v"

# Keep c as Herdr's ordinary append-tab action. The four positional variants
# below use herdr-smart-tab so they match the tmux bindings.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Panes and copy mode
rename_pane = ""
edit_scrollback = "prefix+alt+g"
copy_mode = "prefix+tab"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "prefix+o"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = ["prefix+ctrl+q", "prefix+x"]
zoom = "prefix+z"

resize_mode = "prefix+r"
toggle_sidebar = ["prefix+b", "prefix+ctrl+b"]

navigate_workspace_up = ""
navigate_workspace_down = ""
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Match tmux window creation:
# i/a insert before/after the active tab and maintain base-N/base/base+N names.
# I/A create at the beginning/end without grouped renaming.
[[keys.command]]
key = "prefix+i"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" before'
description = "new tab before current (tmux i)"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" after'
description = "new tab after current (tmux a)"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" first'
description = "new tab at beginning (tmux I)"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" last'
description = "new tab at end (tmux A)"

# Herdr has no clear-scrollback API. Forwarding Ctrl-l preserves the visible
# clear-screen behavior, but retained Herdr scrollback remains available.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear focused terminal (tmux C-l)"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = "bootmux picker"
description = "open bootmux project picker"
width = "80%"
height = "80%"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[experimental]
pane_history = false

[theme]
# Herdr has no built-in Everforest theme. Use a valid base theme and override
# every exposed palette token with the Everforest Dark Medium colors used by
# Neovim's everforest-nvim configuration.
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#7fbbb3"
panel_bg = "#2d353b"
surface0 = "#343f44"
surface1 = "#3d484d"
surface_dim = "#232a2e"
overlay0 = "#7a8478"
overlay1 = "#859289"
text = "#d3c6aa"
subtext0 = "#9da9a0"
mauve = "#d699b6"
green = "#a7c080"
yellow = "#dbbc7f"
red = "#e67e80"
blue = "#7fbbb3"
teal = "#83c092"
peach = "#e69875"
