onboarding = false

[terminal]
# Match tmux's pane_current_path behavior for new panes and tabs.
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# General
help = "prefix+?"
# settings = "prefix+ctrl+t"
detach = "prefix+shift+q"
# prefix+shift+r is rebound below to reload and then renumber tab labels.
reload_config = ""
open_notification_target = "prefix+shift+o"

# Workspace/session navigation. prefix+w is reused below for the bootmux project
# picker instead of Herdr's persistent workspace navigation mode.
goto = "prefix+g"
new_worktree = "prefix+t"
open_worktree = "prefix+ctrl+t"
remove_worktree = "prefix+shift+t"
workspace_picker = ""
new_workspace = ""
rename_workspace = ""
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+ctrl+p"
next_workspace = "prefix+ctrl+n"
switch_workspace = "prefix+shift+1..9"
previous_agent = "prefix+shift+p"
next_agent = "prefix+shift+n"
focus_agent = "prefix+ctrl+1..9"
remote_image_paste = "alt+v"

# Tab creation goes exclusively through the herdr-smart-tab bindings below so
# every created tab gets its positional "N." label prefix renumbered.
new_tab = ""
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
# Closing goes through herdr-smart-tab below so labels renumber afterwards.
close_tab = ""

# Panes and copy mode
rename_pane = ""
edit_scrollback = "prefix+alt+g"
copy_mode = "prefix+tab"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "prefix+o"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = ""
zoom = "prefix+z"

resize_mode = "prefix+r"
toggle_sidebar = ["prefix+b", "prefix+ctrl+b"]

navigate_workspace_up = ""
navigate_workspace_down = ""
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Grouped tab names stay ordered by position (base, base², base³):
# a inserts after the active tab and joins its group.
# i inserts before the active tab and joins the left neighbor's group; at the
#   front it takes the front tab's name, as does I (insert at beginning).
# A appends at the end and joins the last tab's group.
# All four renumber every tab's "N." position prefix afterwards.
[[keys.command]]
key = "prefix+i"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" before'
description = "new tab before current (tmux i)"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" after'
description = "new tab after current (tmux a)"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" first'
description = "new tab at beginning (tmux I)"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" last'
description = "new tab at end (tmux A)"

[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" close-tab'
description = "close tab and renumber"

[[keys.command]]
key = "prefix+x"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" close-pane'
description = "close pane and renumber"

[[keys.command]]
key = "prefix+ctrl+q"
type = "shell"
command = '"${HOME}/dotfiles/bin/herdr-smart-tab" close-pane'
description = "close pane and renumber"

# Reloading config doubles as the manual fixup for reorders the keybindings
# cannot see, e.g. dragging tabs.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" server reload-config && "${HOME}/dotfiles/bin/herdr-smart-tab" renumber-all'
description = "reload config and renumber tabs"

# Herdr has no clear-scrollback API. Forwarding Ctrl-l preserves the visible
# clear-screen behavior, but retained Herdr scrollback remains available.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear focused terminal (tmux C-l)"

# Popup commands are spawned directly by the Herdr server, so they inherit the
# server process environment rather than a pane's login shell. Under
# `herdr --remote` the server is started over a non-interactive SSH session,
# which loads ~/.zshenv but not ~/.zshrc, leaving PATH without ~/.local/bin
# (so bootmux cannot find the herdr binary) and dropping EDITOR and
# FZF_DEFAULT_OPTS. Wrapping in an interactive shell restores that environment.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = 'zsh -ic lazygit'
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = 'zsh -ic "bootmux picker"'
description = "open bootmux project picker"
width = "80%"
height = "80%"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[experimental]
pane_history = false

[theme]
# Herdr has no built-in Everforest theme. Use a valid base theme and override
# every exposed palette token with the Everforest Dark Medium colors used by
# Neovim's everforest-nvim configuration.
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#7fbbb3"
panel_bg = "#2d353b"
surface0 = "#343f44"
surface1 = "#3d484d"
surface_dim = "#232a2e"
overlay0 = "#7a8478"
overlay1 = "#859289"
text = "#d3c6aa"
subtext0 = "#9da9a0"
mauve = "#d699b6"
green = "#a7c080"
yellow = "#dbbc7f"
red = "#e67e80"
blue = "#7fbbb3"
teal = "#83c092"
peach = "#e69875"
